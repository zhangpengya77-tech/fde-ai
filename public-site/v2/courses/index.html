<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FDE-AI V2.0C 無人載具學習中心"><title>學習中心｜FDE-AI V2.0C</title>
<style>
:root{color-scheme:dark;--bg:#061426;--panel:#0d2943;--line:#08c8ff;--text:#eaf8ff;--muted:#a8bfd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123c61,#061426 55%);color:var(--text);font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}a{color:var(--line)}.wrap{width:min(1120px,100%);margin:auto;padding:0 18px}.top{border-bottom:1px solid #185775;background:#06101fe8}.nav{display:flex;gap:14px;align-items:center;min-height:62px}.brand{margin-right:auto;color:var(--text);font-weight:900;text-decoration:none}.brand span{color:var(--line);margin-left:8px}.nav a:not(.brand){border:1px solid #087da8;border-radius:7px;padding:7px 12px;text-decoration:none}.hero{padding:46px 0 26px}.eyebrow{color:var(--line);font-weight:900;letter-spacing:.13em;margin:0}.hero h1{font-size:clamp(2.2rem,6vw,4.1rem);line-height:1.15;margin:8px 0}.hero p,.section-title p,.category-card p,.detail>p,.course-card p,.alumni-card p{color:var(--muted)}.section-title{margin:34px 0 16px}.section-title h2{font-size:clamp(1.6rem,4vw,2.3rem);margin:4px 0}.category-grid,.course-list,.alumni-grid{display:grid;gap:15px}.category-grid{grid-template-columns:repeat(3,1fr)}.category-card{min-height:190px;padding:22px;border:1px solid #087da8;border-radius:9px;background:linear-gradient(145deg,#123b5b,#091d31);color:var(--text);text-align:left;cursor:pointer}.category-card:hover,.category-card:focus-visible{border-color:var(--line);box-shadow:0 0 26px #00bdf233;outline:0}.category-card:nth-child(2){border-top:3px solid #36e5ad}.category-card:nth-child(3){border-top:3px solid #b987ff}.category-no{color:var(--line);font-size:2rem;font-weight:900}.category-card h3{font-size:1.4rem;margin:8px 0}.category-card small{display:block;margin-top:14px;color:#72dcff;font-weight:800}.detail{margin-top:20px;padding:20px;border:1px solid #087da8;border-radius:9px;background:#081d31}.back,.watch{border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--line);padding:7px 11px;cursor:pointer;text-decoration:none;display:inline-block}.detail h3{font-size:1.8rem;margin:18px 0 3px}.course-list{grid-template-columns:repeat(2,1fr)}.course-card,.alumni-card{padding:15px;border:1px solid #147ca4;border-radius:8px;background:#0b2942}.course-card{display:grid;grid-template-columns:44px 1fr;gap:12px}.course-no{display:grid;place-items:center;align-self:start;aspect-ratio:1;border:1px solid var(--line);color:var(--line);font-weight:900}.course-card h4,.alumni-card h3{margin:0 0 7px}.player{margin-top:10px;aspect-ratio:16/9;background:#020811;border-radius:5px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.alumni{margin-top:52px}.alumni-grid{grid-template-columns:repeat(4,1fr)}.alumni-card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;background:#020811}.alumni-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.footer{text-align:center;color:var(--muted);padding:42px 0}@media(max-width:800px){.category-grid,.course-list{grid-template-columns:1fr}.alumni-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.nav{flex-wrap:wrap;padding:10px 0}.brand{width:100%}.nav a:not(.brand){flex:1;text-align:center}.alumni-grid{grid-template-columns:1fr}.wrap{padding:0 13px}}
</style></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="../">FDE-AI <span>V2.0C</span></a><a href="../">首頁</a><a href="./" aria-current="page">學習中心</a></div></header>
<main class="wrap"><section class="hero"><p class="eyebrow">LEARN · 學</p><h1>無人載具學習中心</h1><p>只保留教師指定的三條學習路徑：閉源飛控、開源飛控與 3D 列印。</p></section><section><div class="section-title"><p class="eyebrow">COURSE PATHS</p><h2>三大專區</h2><p>點選專區查看課程與 YouTube 影片。</p></div><div id="categories" class="category-grid"></div><div id="detail" class="detail" hidden></div></section><section class="alumni"><div class="section-title"><p class="eyebrow">ALUMNI &amp; PROJECTS</p><h2>歷屆學員成果</h2><p>保留既有成果內容，影片採隱私增強模式延遲載入。</p></div><div id="alumni" class="alumni-grid"></div></section></main><footer class="footer">FDE-AI V2.0C · 無人載具學習中心</footer>
<script>
const v=(id,title,youtubeUrl,order)=>({id,title,youtubeUrl,order,enabled:true}),S=[
{id:'closed-flight-control',title:'閉源飛控系統',summary:'F450 與 DJI NAZA 組裝、軟體介紹及地面站設定。',c:[v('c1','多旋翼F450&dji naza組裝步驟','https://youtu.be/F9RLymjxsVo?si=Bg5pFoD42r84qFCx',1),v('c2','多旋翼F450&djinaza調參軟體介紹','https://youtu.be/U3VhDWSoLUE?si=KOWQ5Phg2Rok5oNi',2),v('c3','dji naza 地面站調參軟體介紹','https://youtu.be/XbvoZ9LN1YU?si=ioJW6oYzwWvF3lEn',3)]},
{id:'open-flight-control',title:'開源飛控系統',summary:'Pixhawk 2.4.8、Mission Planner 與 AT9S PRO 教學。',c:[v('o1','多旋翼F450&px2.4.8飛控&mp地面站設置說明','https://youtu.be/dWkH5YVi3gY?si=AAcniWN9BjKwF8rL',1),v('o2','MP地面站軟體基礎介紹1','https://youtu.be/N0fW9Q9sWMU?si=hpvsR3KT-3eS1-bZ',2),v('o3','無人機Mp地面站設定飛行計劃講解','https://youtu.be/iqasSBlnyZg?si=U3iOdMhmZC4-ivUQ',3),v('o4','F450无人机 AT9SPRO遥控器调试设置教程','https://youtu.be/omPgcb1PFRM?si=aPQ7hetB-99oYGTR',4)]},
{id:'printing-3d',title:'3D 列印學習',summary:'教師指定 Fusion 360 第 01–16 集，依原始順序排列。',c:[v('p01','Fusion 360 教程（持续更新中） p01 1 Fusion 360 简介','https://youtu.be/krwiLPgX-jc?si=muN0t3CPk6odrwW8',1),v('p02','02 2 安装 Fusion 360','https://youtu.be/PbY0kk5_ZgQ?si=tpmJM_OjU3veo0fq',2),v('p03','fusion360 03 3 用户界面介绍','https://youtu.be/eFx4Y32O5ZA?si=9_eSuQrPkJZI1EnT',3),v('p04','Fusion360 04 4 直线与草图尺寸','https://youtu.be/6GTNxyggWKk?si=rd9yDw8FBNJXYwnh',4),v('p05','Fusion 360 05 5 矩形与圆','https://youtu.be/LWRdX7diPsc?si=LnDl_eiAGIJ_4KQv',5),v('p06','Fusion 360 06 6 圆弧、槽、圆角、点','https://youtu.be/nxsu_WuswFI?si=ZbYkzJQJ2e98iylD',6),v('p07','Fusion 360 07 7 约束','https://youtu.be/fvokyfXBk8c?si=G3kdrho1ASoaNzOh',7),v('p08','Fusion 360 08 8 草图练习1','https://youtu.be/5at7lvtZCHs?si=BcrcSxxXQW4VHO_N',8),v('p09','Fusion 360 09 9 草图练习2','https://youtu.be/9yS8o9lLIP4?si=tnd2vLf16S5cDddd',9),v('p10','13 13 实体命令 拉伸','https://youtu.be/Q4SCpO1bNSM?si=riI3CLw6bv9U7mY1',10),v('p11','Fusion 360 11 11 草图练习4 环形阵列与多边形','https://youtu.be/QLWScjXtKk0?si=I9ru_J3MmYqqUllt',11),v('p12','Fusion 360 12 12 草图练习5 进阶','https://youtu.be/mLZ0bJi0ARE?si=sSn4W4P1uD-tnNjQ',12),v('p13','Fusion 360 14 14 实体命令 旋转','https://youtu.be/uRv467PhPkU?si=MfaSD8jkDsu_UmL6',13),v('p14','Fusion 360 15 15 实体命令 扫掠','https://youtu.be/fJ2a28FoKWI?si=ine09PVeqe8xJ77L',14),v('p15','Fusion 360 16 16 构造基准面','https://youtu.be/BKHmelBgvkE?si=W43xZ9TytUx7hgCl',15),v('p16','Fusion 360 17 实体命令 放样、抽壳、圆角','https://youtu.be/kAqhQ8hqyLk?si=bMjb80BxpPaFAY6w',16)]}];
const A=[['01','2026FDE-Ai無人載具人才孵化平台在職培訓01期','https://www.youtube.com/shorts/r6O-z1nxFfo'],['02','2026FDE-Ai無人載具人才孵化在職培訓日誌','https://www.youtube.com/watch?v=G0M6rd3t9-4'],['03','2026FDE-Ai無人載具人才孵化3d列印測繪小組日誌','https://www.youtube.com/watch?v=Nsv7kD52MnA'],['04','結業啦！期待同學們前程似錦！','https://www.youtube.com/watch?v=YPpK_uQJTMg'],['05','2026FDE_Ai無人載具在職培訓04期','https://www.youtube.com/watch?v=BVVj1zM4lU8'],['06','2026FDE-Ai無人載具人才孵化在職培訓05期','https://www.youtube.com/watch?v=gW5HTVLLKJY'],['07','2026FDE_AI無人載具在職培訓06','https://youtu.be/O_QmYD-b4QU?si=ej5g6w67y-7D77lv'],['職前','2026風電無人機巡檢ai應用職前教育（嘉義）','https://www.youtube.com/watch?v=oXK6lE6KFmI']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=u=>(String(u).match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{6,})/)||[])[1]||'';
const C=document.querySelector('#categories'),D=document.querySelector('#detail');function cards(){D.hidden=true;C.hidden=false;C.innerHTML=S.map((s,i)=>`<button class="category-card" data-s="${s.id}"><span class="category-no">0${i+1}</span><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p><small>${s.c.length} 堂指定課程 →</small></button>`).join('')}function detail(key){const s=S.find(x=>x.id===key);C.hidden=true;D.hidden=false;D.innerHTML=`<button class="back" data-back>← 返回三大專區</button><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p><div class="course-list">${s.c.map(x=>`<article class="course-card"><div class="course-no">${String(x.order).padStart(2,'0')}</div><div><h4>${esc(x.title)}</h4><button class="watch" data-play="${esc(x.youtubeUrl)}">載入影片</button> <a class="watch" href="${esc(x.youtubeUrl)}" target="_blank" rel="noreferrer">開啟 YouTube</a><div class="player" hidden></div></div></article>`).join('')}</div>`}document.addEventListener('click',e=>{const s=e.target.closest('[data-s]');if(s)detail(s.dataset.s);if(e.target.closest('[data-back]'))cards();const b=e.target.closest('[data-play]');if(b){const p=b.parentElement.querySelector('.player'),i=id(b.dataset.play);p.hidden=false;p.innerHTML=`<iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${i}" title="YouTube 影片" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;b.disabled=true;b.textContent='影片已載入'}});document.querySelector('#alumni').innerHTML=A.map(([n,t,u])=>`<article class="alumni-card"><img loading="lazy" src="https://i.ytimg.com/vi/${id(u)}/hqdefault.jpg" alt="${esc(t)} 縮圖"><h3>${esc(t)}</h3><p>成果影片 · ${esc(n)}</p><div class="alumni-actions"><button class="watch" data-a="${esc(u)}">載入影片</button><a class="watch" href="${esc(u)}" target="_blank" rel="noreferrer">開啟 YouTube</a></div><div class="player" hidden></div></article>`).join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const p=b.closest('.alumni-card').querySelector('.player');p.hidden=false;p.innerHTML=`<iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${id(b.dataset.a)}" title="歷屆學員成果影片" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;b.disabled=true;b.textContent='影片已載入'});cards();
</script></body></html>
