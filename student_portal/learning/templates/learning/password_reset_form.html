{% extends 'learning/base.html' %}
{% block title %}重設密碼｜FDE-AI{% endblock %}
{% block content %}
<section class="form-panel"><h1>重設密碼</h1><p class="muted">輸入已驗證的電子郵件；若帳號符合條件，系統會寄送重設連結。</p>
  <form method="post">{% csrf_token %}<div class="field"><label for="id_email">電子郵件</label>{{ form.email }}{% for error in form.email.errors %}<p class="error">{{ error }}</p>{% endfor %}</div><button class="button primary full" type="submit">寄送重設連結</button></form>
</section>
{% endblock %}
