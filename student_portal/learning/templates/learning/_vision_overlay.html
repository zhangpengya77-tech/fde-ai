<div class="vision-overlay"><img src="{% url 'learning:vision_inspection_image' record.pk %}" alt="檢測圖片"><svg viewBox="0 0 {{ record.image_width }} {{ record.image_height }}" preserveAspectRatio="none" aria-hidden="true">{% for box in overlay %}<g class="{{ box.css }}"><rect x="{{ box.x }}" y="{{ box.y }}" width="{{ box.width }}" height="{{ box.height }}" vector-effect="non-scaling-stroke"></rect></g>{% endfor %}</svg></div>
<ul class="vision-detections">{% for box in overlay %}<li><span class="vision-tag {{ box.css }}">{{ box.label }}</span></li>{% empty %}<li>未偵測到信心值 0.50 以上的目標。</li>{% endfor %}</ul>
<style>.vision-overlay{position:relative;max-width:640px}.vision-overlay img{display:block;width:100%;height:auto}.vision-overlay svg{position:absolute;inset:0;width:100%;height:100%}.vision-overlay rect{fill:none;stroke-width:3px}.vision-overlay .cw rect{stroke:#0b7a75}.vision-overlay .ccw rect{stroke:#c2410c}.vision-detections{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}.vision-tag{display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;font-size:14px}.vision-tag.cw{background:#0b7a75}.vision-tag.ccw{background:#c2410c}</style>
