{% extends 'learning/base.html' %}
{% block title %}電子郵件驗證｜FDE-AI{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>驗證電子郵件</h1>
  <p class="muted">FDE ID：{{ public_user_id }}。驗證碼已寄送至註冊信箱，15 分鐘內有效。</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="code">6 位數驗證碼</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></div>
    <button class="button primary full" type="submit">驗證並啟用</button>
  </form>
  <form method="post" action="{% url 'learning:resend_activation' public_user_id %}">{% csrf_token %}
    <button class="button full" type="submit">重新寄送驗證碼</button>
  </form>
</section>
{% endblock %}
