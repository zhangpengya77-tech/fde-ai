window.TOTAL = acc;

// ───── 小工具 ─────
const $ = (s) => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);              // 先快後慢
const prog = (t, a, d) => ease((t - a) / d);                     // t 在 a 之後 d 秒內從 0→1
function show(el, p, dy = 40) { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px) scale(${0.96 + 0.04 * p})`; }

// ───── 動態建立：學練做測證徽章、勾選清單、人才卡片 ─────
const STEPS = [['學', 'LEARN', '基礎課程', '0,194,255'], ['練', 'PRACTICE', '模擬飛行', '53,230,168'], ['做', 'BUILD', 'F450 組裝', '255,176,46'], ['測', 'TEST', 'AI 評量', '255,61,240'], ['證', 'CERTIFY', '成果紀錄', '155,123,255']];
const stepsLayer = $('#s-steps');
STEPS.forEach(([zh, en, desc, rgb], i) => {
  const y = 500 + i * 205;
  stepsLayer.insertAdjacentHTML('beforeend',
    `<div class="badge" id="b${i}" style="left:120px;top:${y}px;border:4px solid rgb(${rgb});text-shadow:0 0 10px #fff,0 0 26px rgb(${rgb})">${zh}</div>` +
    `<div class="badge-desc" id="bd${i}" style="left:370px;top:${y + 50}px"><span style="font-family:Orbitron;color:rgb(${rgb});font-size:30px;letter-spacing:.14em">${en}</span><br>${desc}</div>`);
});
const TICKS = ['F450 AI 陪做（鏡頭＋語音）', '飛行日誌健康分析', 'AI PID 與濾波實驗室', 'AI 視覺檢測＋教師覆核', '學習成長紀錄（R01–R08）'];
const doneLayer = $('#s-done');
TICKS.forEach((txt, i) => doneLayer.insertAdjacentHTML('beforeend', `<div class="tick" id="t${i}" style="top:${800 + i * 120}px"><i>✓</i>${txt}</div>`));
const TALENTS = [['飛', '職業飛手'], ['巡', '巡檢人才'], ['影', '空拍影視'], ['師', '種子教師'], ['控', '飛控工程師'], ['研', 'AI 研發']];
const talentLayer = $('#s-talent');
TALENTS.forEach(([c, n], i) => {
  const col = i % 3, row = Math.floor(i / 3);
  talentLayer.insertAdjacentHTML('beforeend', `<div class="talent" id="tl${i}" style="left:${110 + col * 300}px;top:${580 + row * 290}px"><b>${c}</b><span>${n}</span></div>`);

// ───── 背景：網格、粒子、霓虹無人機（canvas 畫，依 t 計算）─────
const cv = $('#fx'), g = cv.getContext('2d');
const P = Array.from({ length: 70 }, (_, i) => ({ x: (i * 397) % 1080, y: (i * 911) % 1920, s: 1 + (i % 3), v: 20 + (i % 7) * 9 }));
function drawBg(t) {
  g.clearRect(0, 0, 1080, 1920);
  // 透視網格（合成波風格），緩慢往前流動
  g.save(); g.globalAlpha = 0.22; g.strokeStyle = '#1fbfff'; g.lineWidth = 1.2;
  const horizon = 1250, off = (t * 40) % 80;
  for (let k = 0; k < 18; k++) { const y = horizon + Math.pow((k * 80 + off) / 1440, 1.8) * 700; g.beginPath(); g.moveTo(0, y); g.lineTo(1080, y); g.stroke(); }
  for (let k = -12; k <= 12; k++) { g.beginPath(); g.moveTo(540 + k * 18, horizon); g.lineTo(540 + k * 160, 1920); g.stroke(); }

  P.forEach((p) => { const y = (p.y - t * p.v) % 1920; g.fillStyle = `rgba(0,194,255,${0.25 + 0.15 * (p.s - 1)})`; g.beginPath(); g.arc(p.x, y < 0 ? y + 1920 : y, p.s, 0, 7); g.fill(); });

// 霓虹四旋翼（俯視示意，非寫實）：四槳各自旋轉、相鄰反向，外圈霓虹光環
function drawDrone(cx, cy, sc, t, alpha) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha; g.translate(cx, cy + Math.sin(t * 2) * 10 * sc); g.scale(sc, sc);

  const grad = g.createLinearGradient(-330, 0, 330, 0); grad.addColorStop(0, '#29f0ff'); grad.addColorStop(0.5, '#ff3df0'); grad.addColorStop(1, '#9b7bff');

  g.lineCap = 'round';
  arms.forEach(([sx, sy, c]) => { g.strokeStyle = c; g.shadowColor = c; g.shadowBlur = 24; g.lineWidth = 16; g.beginPath(); g.moveTo(0, 0); g.lineTo(sx * 150, sy * 150); g.stroke(); });
  g.shadowBlur = 30; g.shadowColor = '#00c2ff'; g.fillStyle = '#0b1b33'; g.strokeStyle = '#7fe3ff'; g.lineWidth = 4;
  g.beginPath(); g.roundRect(-62, -62, 124, 124, 22); g.fill(); g.stroke();
  g.fillStyle = '#00c2ff'; g.font = '900 34px Orbitron'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('FDE', 0, 2);
  // 四槳：前左／後右順時針，前右／後左逆時針
  arms.forEach(([sx, sy, c], i) => {
    const dir = (i === 1 || i === 2) ? -1 : 1;
    g.save(); g.translate(sx * 150, sy * 150);
    g.strokeStyle = c; g.lineWidth = 3; g.shadowBlur = 18; g.beginPath(); g.arc(0, 0, 78, 0, 7); g.stroke();
    g.fillStyle = 'rgba(220,250,255,.12)'; g.beginPath(); g.arc(0, 0, 74, 0, 7); g.fill();
    g.rotate(dir * t * 14); g.fillStyle = 'rgba(230,252,255,.92)'; g.shadowColor = '#bff8ff';
    g.beginPath(); g.ellipse(0, 0, 70, 9, 0, 0, 7); g.fill();
    g.globalAlpha *= 0.35; g.rotate(-dir * 0.35); g.beginPath(); g.ellipse(0, 0, 70, 9, 0, 0, 7); g.fill();
    g.restore();
  });
  g.restore();
}

// ───── 主要函式：把畫面設成第 t 秒 ─────
window.seek = function (t) {
  drawBg(t);
  const cur = SCENES.find((s) => t >= s.start && t < s.start + s.dur) || SCENES[SCENES.length - 1];
  // 場景淡入淡出（每段前 0.5 秒淡入、後 0.4 秒淡出）
  SCENES.forEach((s) => {

  });
  const L = (id) => t - SCENES.find((s) => s.id === id).start;

  const li = L('intro');
  const droneIn = SCENES[0].dur;
  show($('#intro-title'), prog(li, 1.0, 1.0)); show($('#intro-sub'), prog(li, 1.6, 1.0)); show($('#intro-en'), prog(li, 2.2, 1.0));

  const lw = L('who');

  show($('#who-line'), prog(lw, 3.0, 1.0));
  // 學練做測證：依序亮起，彩色光暈脈動
  const ls = L('steps'), per = (SCENES[2].dur - 2.5) / 5;
  STEPS.forEach(([, , , rgb], i) => {
    const p = prog(ls, 1.0 + i * per, 0.6);
    const b = $('#b' + i), d = $('#bd' + i);
    b.style.opacity = p; d.style.opacity = p;
    b.style.transform = `scale(${0.6 + 0.4 * p})`; d.style.transform = `translateX(${(1 - p) * 60}px)`;
    const pulse = 0.5 + 0.5 * Math.sin(t * 4 + i);
    b.style.boxShadow = `0 0 ${20 + 30 * pulse}px rgba(${rgb},${0.5 + 0.4 * pulse}), inset 0 0 24px rgba(${rgb},.45)`;
  });
  // 已經做到：數百名放大＋清單逐條打勾
  const ld = L('done');
  show($('#done-num'), prog(ld, 0.5, 0.8), 80);
  TICKS.forEach((_, i) => { const el = $('#t' + i), p = prog(ld, 2.0 + i * 1.0, 0.6); el.style.opacity = p; el.style.transform = `translateX(${(1 - p) * -80}px)`; });
  // 培養人才：六張卡片依序翻出
  const lt2 = L('talent');
  TALENTS.forEach((_, i) => { const el = $('#tl' + i), p = prog(lt2, 0.6 + i * 0.6, 0.6); el.style.opacity = p; el.style.transform = `rotateY(${(1 - p) * 80}deg)`; });
  // 結尾：無人機回來＋按鈕發光
  const lc = L('cta');
  const btn = $('#cta-btn'); show(btn, prog(lc, 1.0, 0.8)); btn.style.boxShadow = `0 0 ${40 + 30 * Math.sin(t * 5)}px rgba(0,194,255,.7)`;
  // 字幕：目前場景的旁白
  const sub = $('#sub'); if (sub.dataset.id !== cur.id) { sub.textContent = cur.text; sub.dataset.id = cur.id; }
  sub.style.opacity = clamp((t - cur.start) / 0.3);
  if (window.render3d) window.render3d(t, cur.id, t - cur.start, cur.dur);
};
// 字型與 3D 模型都載好才算準備完成（錄製程式會等 READY）
Promise.all([document.fonts.ready, new Promise((r) => { window.__glReady = r; })]).then(() => { window.READY = true; seek(Number(new URLSearchParams(location.search).get('t') || 0)); });
</script>

    const geo = m.geometry.clone(); geo.translate(-c.x, -c.y, -c.z);
    const pivot = new THREE.Group(); pivot.position.copy(c).add(m.position);
    pivot.add(new THREE.Mesh(geo, glass({ color: 0xe8f6ff, emissive: 0x3fc8ff, emissiveIntensity: 0.5, opacity: 0.85 })));
    [0.22, 0.44].forEach((lag, i) => { const gm = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x8fe8ff, transparent: true, opacity: i ? 0.1 : 0.22, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })); gm.rotation.y = lag; pivot.add(gm); });
    const pos = pm[1].toUpperCase();
    props.push({ pivot, dir: pos === 'FR' || pos === 'RL' ? 1 : -1, speed: 22 + props.length * 0.9 });
    drone.add(pivot); m.parent?.remove(m); return;
  }
  const n = label.toLowerCase();
  const mat = n.includes('motor') ? glass({ color: 0x7fe6ff, emissive: 0x16c8ff, emissiveIntensity: 0.9, opacity: 0.8 })
    : n.includes('pixhawk') ? glass({ color: 0x0c1a26, emissive: 0x0b5f95, emissiveIntensity: 0.6, opacity: 0.85 })
    : glass({ color: 0xdff4ff, emissive: 0x0a5a7a, emissiveIntensity: 0.3, opacity: n.includes('latticearm') ? 0.3 : 0.26 });
  m.material = mat;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 28), new THREE.LineBasicMaterial({ color: 0x7fe3ff, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending })));
});
drone.add(gltf.scene);
// 每個場景的無人機位置／大小／透明度：開場與結尾在前景，中段退到背景當襯底
const LOOK = { intro: [0, 150, 0.55, 1.0], who: [0, -170, 0.6, 0.3], steps: [70, -120, 0.55, 0.2], done: [-40, -150, 0.6, 0.26], talent: [40, -160, 0.6, 0.26], cta: [0, -270, 0.5, 0.95] };
let prevLook = LOOK.intro;
function lerp(a, b, k) { return a + (b - a) * k; }
window.render3d = function (t, id, lt, dur) {
  props.forEach((p) => { p.pivot.rotation.y = p.dir * p.speed * t; });          // 四槳各自旋轉
  const target = LOOK[id] || LOOK.intro, k = Math.min(1, lt / 1.2), e = 1 - Math.pow(1 - k, 3);
  const L = target.map((v, i) => lerp(prevLook[i], v, e));
  if (k >= 1) prevLook = target;
  drone.position.set(L[0], L[1] + Math.sin(t * 1.4) * 8, 0);
  drone.rotation.set(-0.05 + Math.sin(t * 0.7) * 0.03, 0.5 + t * 0.12, Math.sin(t * 0.55) * 0.05);
  drone.scale.setScalar(L[2]);
  canvas.style.opacity = L[3];
  camera.position.set(0, 520, -1500); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
};
window.__glReady();
</script>
